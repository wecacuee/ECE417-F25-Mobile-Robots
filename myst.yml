        - file: chapters/01-py-intro/Python_2.ipynb
        - file: chapters/01-py-intro/Python_3.ipynb
    - file: chapters/01-1901-discrete-planning/Discrete Planning.ipynb
    - file: hw/01-1901-discrete-planning/HW2_BFSDijkstraAndPriorityQueue.ipynb
    - file: chapters/01-1901-discrete-planning/RRT.ipynb
    - file: chapters/01-1901-discrete-planning/PRM.ipynb
    - file: "tutorials/00-jetbot/ECE417_ 01-Jetbot assembly.md"
      children:
      - file: "tutorials/00-jetbot/ECE417_ 02-Jetbot software setup.md"
      - file: "tutorials/00-jetbot/ECE417_ 02.5-Getting to know your Jetbot.md"
      - file: "tutorials/00-jetbot/ECE417_ 03-First ROS nodes, Wireguard VPN and DDS.md"
      - file: "tutorials/00-jetbot/ECE417_ 04-Making your own ROS nodes.md"
      - file: "tutorials/00-jetbot/ECE417_05-ARTagsAnd3DPoseEstimation.md"
    - file: hw/mt1/Midterm1.ipynb
    - file: chapters/02-18-rot/RotationNotes.ipynb
    - file: chapters/02-18-rot/RotationDemo.ipynb
    - file: chapters/02-18-rot/02-RotationNotes.ipynb

